services:
  airline-system-api:
    image: nmesar29/ams-backend
    container_name: airline-system-api
    ports:
      - "8080:8080"
    depends_on:
      - airline-system-database
    environment:
      WAIT_HOSTS: airline-system-database:1433
    restart: on-failure
  airline-system-interface:
    image: nmesar29/ams-frontend
    container_name: airline-system-interface
    ports:
      - "9999:80"
    depends_on:
      - airline-system-api
    restart: on-failure    
volumes:
  sqlserver_data: